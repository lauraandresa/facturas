<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a6e6e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Mis facturas</title>
<style>
:root{--bg:#f4f6f6;--tx:#10201f;--mut:#566766;--ac:#0a6e6e;--ok:#15803d;--bad:#b91c1c;--ln:#d5dedd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.4 system-ui,sans-serif;padding-bottom:88px}
header{background:var(--ac);color:#fff;padding:12px 10px;display:flex;align-items:center;position:sticky;top:0;z-index:5}
header span{flex:1;font-size:22px;font-weight:700;padding-left:6px}
header button{background:none;border:0;color:#fff;font-size:28px;width:48px;height:44px}
main{padding:16px;max-width:560px;margin:auto}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;min-height:58px;border:2px solid var(--ac);border-radius:14px;background:var(--ac);color:#fff;font:700 19px system-ui;margin-bottom:12px;padding:12px}
.btn.s{background:#fff;color:var(--ac)}.btn.g{background:var(--ok);border-color:var(--ok)}
.btn.r{background:#fff;color:var(--bad);border-color:var(--bad)}.btn.m{min-height:46px;font-size:16px;margin:0}
.big{min-height:120px;font-size:26px;line-height:1.5}
label{display:block;font-weight:600;margin:14px 0 4px}
input,select{width:100%;font:inherit;padding:13px;border:2px solid var(--ln);border-radius:12px;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:3px solid #7cc4c4;border-color:var(--ac)}
.alert{background:#fff4d6;border:2px solid #e0a100;border-radius:14px;padding:14px;margin-bottom:12px;font-weight:600}
.alert .btn{margin:10px 0 0}
.tot{display:flex;justify-content:space-between;padding:3px 0}
.tot.t{font-weight:800;font-size:24px;border-top:2px solid var(--ln);margin-top:6px;padding-top:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mut{color:var(--mut);font-size:15px}
.tag{font-size:14px;font-weight:700;border-radius:8px;padding:3px 9px;background:#e4eaea;display:inline-block;margin:2px 2px 2px 0}
.tag.w{background:#ffe29a}.tag.k{background:#c3ecd0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln)}
nav button{flex:1;border:0;background:none;padding:10px 2px 12px;font:600 14px system-ui;color:var(--mut)}
nav button.on{color:var(--ac)}nav b{display:block;font-size:24px}
.modal{position:fixed;inset:0;background:#0009;display:flex;padding:20px;z-index:9}
.modal>div{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:520px;margin:auto}
h2{margin:0 0 8px}
</style></head><body>
<header><button id="bk" onclick="back()">‹</button><span id="t"></span><button onclick="go('aj')">⚙</button></header>
<main id="app"></main><div id="m"></div>
<nav>
<button data-v="home" onclick="go('home')"><b>🏠</b>Inicio</button>
<button data-v="fl" onclick="go('fl')"><b>🧾</b>Facturas</button>
<button data-v="rl" onclick="go('rl')"><b>📝</b>Recibos</button>
<button data-v="cl" onclick="go('cl')"><b>👥</b>Clientes</button>
</nav>
<script src="jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app'),K='facturas-v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{me:{},cli:[],fac:[],rec:[],next:null,concepto:'LIMPIEZA DE SU ESTABLECIMIENTO',bk:null};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('No se pudo guardar en el móvil. Avisa a quien te ayuda.')}};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const uid=()=>Math.random().toString(36).slice(2,10),r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const eur=n=>Number(n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=i=>i.split('-').reverse().join('/');
const trimOf=i=>i.slice(0,4)+'-T'+(Math.floor((+i.slice(5,7)-1)/3)+1);
const trL=t=>t.split('-T')[1]+'T '+t.split('-')[0];
function trimOpts(sel){const y=new Date().getFullYear(),o=[];for(let a=y+1;a>=y-1;a--)for(let q=4;q>=1;q--)o.push(a+'-T'+q);if(!o.includes(sel))o.push(sel);return o.map(t=>`<option value="${t}" ${t==sel?'selected':''}>${trL(t)}</option>`).join('')}
const cliOpts=()=>'<option value="">— Elegir cliente —</option>'+S.cli.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
function addCli(c){const k=(c.nombre||'').trim();if(!k)return;let x=S.cli.find(y=>y.nombre.toLowerCase()==k.toLowerCase());if(!x){x={id:uid()};S.cli.push(x)}x.nombre=k;x.calle=c.calle||x.calle||'';x.nif=c.nif||x.nif||'';if(c.precio)x.precio=c.precio}
const tags=f=>f.estado=='anulada'?'<span class=tag>Anulada</span>':`<span class="tag ${f.enviada?'k':''}">${f.enviada?'Enviada':'Sin enviar'}</span><span class="tag ${f.copia?'k':'w'}">${f.copia?'Copia en Drive':'Falta copia en Drive'}</span>${f.corr?'<span class=tag>Corregida</span>':''}`;

/* ---------- PDF ---------- */
const PDF=()=>new window.jspdf.jsPDF({unit:'mm',format:'a4'});
function drawF(d,f,y){
 const m=S.me,L=15,R=195;
 d.setFont('helvetica','normal');d.setFontSize(10);d.text(fdate(f.fecha),R,y+10,{align:'right'});
 d.setFont('helvetica','bold');d.setFontSize(11);d.text((m.nombre||'').toUpperCase(),L,y+18);
 d.setFont('helvetica','normal');d.setFontSize(10);
 d.text('N.I.F.: '+(m.nif||''),L,y+25);d.text('MOVIL: '+(m.tel||''),L,y+31);d.text(m.dir||'',L,y+37);
 const t=y+43,ys=[t+10,t+38,t+47,t+56,t+65];
 d.setLineWidth(.3);d.rect(L,t,R-L,74);ys.forEach(v=>d.line(L,v,R,v));d.line(105,t,105,t+38);d.line(105,t+38,105,t+74);
 d.setFont('helvetica','bold');d.text('FACTURA Nº: '+f.num,L+2,t+6.5);d.text('DESTINATARIO:',107,t+6.5);
 d.text('CONCEPTO:',L+2,t+44);d.text('IMPORTE:',107,t+44);
 d.setFont('helvetica','normal');d.text('Fdo.:',L+2,t+16);
 d.text(d.splitTextToSize([f.nombre,f.calle,f.nif].filter(Boolean).join('\n'),86),107,t+16);
 d.text(d.splitTextToSize(f.concepto||'',88),L+2,t+53);d.text(eur(f.base)+' €',R-2,t+53,{align:'right'});
 d.text('+21% IVA',L+2,t+62);d.text(eur(f.iva)+' €',R-2,t+62,{align:'right'});
 d.setFont('helvetica','bold');d.text('TOTAL',L+2,t+71);d.text(eur(f.total)+' €',R-2,t+71,{align:'right'});
}
function facPDF(f,n){const d=PDF();for(let i=0;i<n;i++)drawF(d,f,i*148);return d.output('blob')}
function recPDF(L){const d=PDF();L.forEach((r,i)=>{const y=i*99+14;
 d.setFontSize(12);d.setFont('helvetica','bold');d.text('RECIBO',15,y);d.setFont('helvetica','normal');
 d.text('CONCEPTO: '+(r.concepto||''),15,y+10);d.text('DESTINATARIO: '+r.nombre,15,y+20);d.text('FECHA: '+fdate(r.fecha),15,y+30);
 d.setFont('helvetica','bold');d.text('TOTAL: '+eur(r.total)+' €',195,y+42,{align:'right'});d.setFont('helvetica','normal');d.text('Fdo.:',15,y+54);
 if(i<2){d.setLineDash([2,2]);d.line(10,y+78,200,y+78);d.setLineDash([])}});return d.output('blob')}
const fname=f=>`${f.trim}_F${f.num}_${f.nombre.replace(/[^A-Za-z0-9]+/g,'-')}.pdf`;
const mk=(b,n,t)=>new File([b],n,{type:t||'application/pdf'});

/* ---------- compartir ---------- */
async function shareFiles(files){
 if(navigator.canShare&&navigator.canShare({files})){
  try{await navigator.share({files});return true}catch(e){if(e.name==='AbortError')return false}
 }
 files.forEach(f=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()});
 alert('El móvil no abrió el menú de compartir. El archivo se ha descargado.');return 'dl';
}
async function sendF(id){const f=S.fac.find(x=>x.id==id);if(await shareFiles([mk(facPDF(f,1),fname(f))])===true){f.enviada=true;save();render()}}
async function printF(id){const f=S.fac.find(x=>x.id==id);shareFiles([mk(facPDF(f,2),'IMPRIMIR_'+fname(f))])}
async function copyF(id){const f=S.fac.find(x=>x.id==id);if(await shareFiles([mk(facPDF(f,1),fname(f))])===true){f.copia=true;save();render()}}
async function sendTrim(){const L=S.fac.filter(f=>f.trim==ftr&&f.estado!='anulada').sort((a,b)=>a.num-b.num);shareFiles(L.map(f=>mk(facPDF(f,1),fname(f))))}
async function printR(){const L=S.rec.filter(r=>chk.has(r.id)).sort((a,b)=>a.fecha.localeCompare(b.fecha));if(L.length)shareFiles([mk(recPDF(L),'IMPRIMIR_recibos.pdf')])}
async function backup(){if(await shareFiles([mk(JSON.stringify(S),'copia-facturas-'+today()+'.json','text/plain')])){S.bk=today();save();render()}}
const showM=h=>$('#m').innerHTML=`<div class=modal><div>${h}</div></div>`,closeM=()=>$('#m').innerHTML='';
const askCopy=id=>{const f=S.fac.find(x=>x.id==id);showM(`<h2>Guarda la copia</h2><p>Guárdala en la carpeta <b>${trL(f.trim)}</b> de Drive para que no se pierda.</p><button class="btn g" onclick="copyF('${id}');closeM()">💾 Guardar copia ahora</button><button class="btn s" style="margin:0" onclick="closeM()">Más tarde</button>`)};

async function copyR(id){const r=S.rec.find(x=>x.id==id);if(await shareFiles([mk(recPDF([r]),'recibo_'+r.fecha+'_'+r.nombre.replace(/[^A-Za-z0-9]+/g,'-')+'.pdf')])===true){r.copia=true;save();render()}}
const askCopyR=id=>showM(`<h2>Guarda la copia</h2><p>Guarda el recibo en tu carpeta de recibos de Drive para que no se pierda.</p><button class="btn g" onclick="copyR('${id}');closeM()">💾 Guardar copia ahora</button><button class="btn s" style="margin:0" onclick="closeM()">Más tarde</button>`);
const steps=(t,l,fn)=>showM(`<h2>${t}</h2><ol style="padding-left:24px;font-size:20px;line-height:1.6">${l.map(s=>`<li>${s}</li>`).join('')}</ol><button class="btn" onclick="closeM();${fn}">Continuar</button><button class="btn s" style="margin:0" onclick="closeM()">Cancelar</button>`);
const askPrint=id=>steps('Para imprimir',['Se abre una lista de aplicaciones.','Busca y selecciona <b>HP Print</b>.'],"printF('"+id+"')");
const askPrintR=()=>steps('Para imprimir',['Se abre una lista de aplicaciones.','Busca y selecciona <b>HP Print</b>.'],'printR()');
const askSend=id=>steps('Para enviar',['Se abre una lista de aplicaciones.','Selecciona <b>Yahoo</b> y escribe la dirección de correo,<br>o selecciona <b>WhatsApp</b> y el contacto.'],"sendF('"+id+"')");
const askTrim=()=>steps('Para enviar al gestor',['Se abre una lista de aplicaciones.','Selecciona <b>Yahoo</b> y escribe la dirección de correo de la gestora.'],'sendTrim()');
/* ---------- pantallas ---------- */
let view='home',arg=null,ftr=null,cq='',chk=new Set();
const V={},BACK={ff:'fl',fd:'fl',rf:'rl',cf:'cl',pend:'home',aj:'home'},NAV={pend:'home',aj:'home',ff:'fl',fd:'fl',rf:'rl',cf:'cl'};
const go=(v,a)=>{view=v;arg=a;render();scrollTo(0,0)},back=()=>go(BACK[view]||'home');
function render(){
 $('#t').textContent={home:'Mis facturas',pend:'Falta guardar copia',ff:'Factura',fd:'Factura',fl:'Facturas',rl:'Recibos',rf:'Recibo',cl:'Clientes',cf:'Cliente',aj:'Mis datos'}[view];
 $('#bk').style.visibility=BACK[view]?'visible':'hidden';
 app.innerHTML=V[view](arg);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(NAV[view]||view)));
 if(view=='ff')upd();
}
V.home=()=>{
 const p=S.fac.filter(f=>f.estado!='anulada'&&!f.copia).concat(S.rec.filter(r=>!r.copia)),old=(S.fac.length+S.rec.length)&&(!S.bk||(Date.now()-new Date(S.bk))/864e5>14);
 return `${!S.me.nombre?`<div class=alert>Antes de empezar, escribe tus datos.<button class=btn onclick="go('aj')">Escribir mis datos</button></div>`:''}
 ${p.length?`<div class=alert>⚠️ ${p.length==1?'Falta 1 documento':'Faltan '+p.length+' documentos'} por guardar en Drive.<button class=btn onclick="go('pend')">Guardar ahora</button></div>`:''}
 ${old?`<div class=alert>Hace más de 2 semanas que no haces la copia de seguridad.<button class=btn onclick="backup()">Hacer copia ahora</button></div>`:''}
 <button class="btn big" onclick="go('ff')">🧾<br>Nueva factura</button>
 <button class="btn big s" onclick="go('rf')">📝<br>Nuevo recibo</button>`};
V.pend=()=>{const p=S.fac.filter(f=>f.estado!='anulada'&&!f.copia).sort((a,b)=>a.num-b.num);
 return p.map(f=>`<div class=card><b>Nº ${f.num} · ${esc(f.nombre)}</b><div class=mut>Carpeta ${trL(f.trim)}</div><button class="btn g" style="margin:10px 0 0" onclick="copyF('${f.id}')">💾 Guardar copia</button></div>`).join('')+S.rec.filter(r=>!r.copia).map(r=>`<div class=card><b>Recibo · ${esc(r.nombre)}</b><div class=mut>${fdate(r.fecha)} · ${eur(r.total)} €</div><button class="btn g" style="margin:10px 0 0" onclick="copyR('${r.id}')">💾 Guardar copia</button></div>`).join('')||'<p>Todo guardado. 👍</p>'};
V.ff=id=>{
 const f=id&&S.fac.find(x=>x.id==id)||{},fe=f.fecha||today(),first=S.next==null&&!f.num;
 return `${id&&(f.enviada||f.copia)?'<div class=alert>Esta factura ya la enviaste o la guardaste. Si la cambias, tendrás que enviarla y guardarla otra vez.</div>':''}
 <div class=card><label style="margin-top:0">Cliente</label><select onchange="fillC(this.value)">${cliOpts()}</select>
 <label>Nombre</label><input id=n value="${esc(f.nombre)}">
 <label>Calle</label><input id=c value="${esc(f.calle)}">
 <label>NIF o CIF (si lo tiene)</label><input id=nf value="${esc(f.nif)}">
 <label>Importe SIN IVA (€)</label><input id=b inputmode=decimal value="${f.base??''}" oninput="upd()">
 <div style="margin-top:12px"><div class=tot><span>IVA 21%</span><b id=iv></b></div><div class="tot t"><span>TOTAL</span><span id=to></span></div></div></div>
 <div class=card><label style="margin-top:0">Fecha</label><input id=fe type=date value="${fe}" onchange="$('#tr').value=trimOf(this.value)">
 <label>Carpeta del trimestre</label><select id=tr>${trimOpts(f.trim||trimOf(fe))}</select>
 <label>Nº de factura${first?' (el de tu última factura + 1)':''}</label><input id=nu inputmode=numeric value="${f.num||S.next||''}">
 <label>Concepto</label><input id=co value="${esc(f.concepto||S.concepto)}"></div>
 <button class=btn onclick="saveF('${id||''}')">Guardar factura</button>`};
const fillC=id=>{const c=S.cli.find(x=>x.id==id);if(!c)return;$('#n').value=c.nombre;$('#c').value=c.calle;$('#nf').value=c.nif||'';$('#b').value=c.precio||'';upd()};
function upd(){const b=r2(num($('#b').value)),i=r2(b*.21);$('#iv').textContent=b?eur(i)+' €':'—';$('#to').textContent=b?eur(b+i)+' €':'—'}
function saveF(id){
 const g=i=>$('#'+i).value.trim(),nombre=g('n'),calle=g('c'),base=r2(num(g('b'))),n=parseInt(g('nu'));
 if(!nombre||!calle||base<=0)return alert('Falta el nombre, la calle o el importe.');
 if(!n)return alert('Falta el número de factura.');
 if(S.fac.some(f=>f.num==n&&f.id!=id))return alert('Ya existe la factura nº '+n+'.');
 const iva=r2(base*.21),d={num:n,fecha:g('fe'),trim:g('tr'),nombre,calle,nif:g('nf'),base,iva,total:r2(base+iva),concepto:g('co')};
 let f=id&&S.fac.find(x=>x.id==id);
 if(f){if(f.enviada||f.copia){f.hist=(f.hist||[]).concat([{num:f.num,fecha:f.fecha,nombre:f.nombre,calle:f.calle,nif:f.nif,base:f.base,total:f.total,en:today()}]);f.corr=true;f.enviada=false;f.copia=false}Object.assign(f,d)}
 else{f={id:uid(),estado:'activa',enviada:false,copia:false,...d};S.fac.push(f)}
 S.next=Math.max(S.next||0,n+1);addCli({nombre,calle,nif:d.nif,precio:base});save();go('fd',f.id);askCopy(f.id);
}
V.fd=id=>{const f=S.fac.find(x=>x.id==id);if(!f)return'';
 return `<div class=card><div class=row><b>Factura nº ${f.num}</b><span class=mut>${fdate(f.fecha)}</span></div>
 <div style="font-size:21px;margin:6px 0">${esc(f.nombre)}</div><div class=mut>${esc(f.calle)}</div>
 <div class="tot t"><span>Total</span><span>${eur(f.total)} €</span></div><div class=mut>Sin IVA ${eur(f.base)} € · IVA ${eur(f.iva)} € · Carpeta ${trL(f.trim)}</div>
 <div style="margin-top:10px">${tags(f)}</div></div>
 ${f.estado=='anulada'?'':`<button class=btn onclick="askSend('${id}')">📤 Enviar (WhatsApp o Yahoo)</button>
 <button class="btn s" onclick="askPrint('${id}')">🖨️ Imprimir</button>
 <button class="btn ${f.copia?'s':'g'}" onclick="copyF('${id}')">💾 ${f.copia?'Guardar otra copia':'Guardar copia en Drive ('+trL(f.trim)+')'}</button>
 <button class="btn s" onclick="go('ff','${id}')">✏️ Corregir</button>
 <button class="btn r" onclick="anular('${id}')">Anular factura</button>`}`};
function anular(id){if(!confirm('¿Anular esta factura? Se queda en la lista como anulada y su número no se vuelve a usar.'))return;S.fac.find(x=>x.id==id).estado='anulada';save();render()}
V.fl=()=>{ftr=ftr||trimOf(today());
 const ts=[...new Set(S.fac.map(f=>f.trim).concat(ftr))].sort().reverse(),L=S.fac.filter(f=>f.trim==ftr).sort((a,b)=>b.num-a.num),ok=L.filter(f=>f.estado!='anulada');
 return `<button class=btn onclick="go('ff')">➕ Nueva factura</button>
 <select style="margin-bottom:12px" onchange="ftr=this.value;render()">${ts.map(t=>`<option value="${t}" ${t==ftr?'selected':''}>Trimestre ${trL(t)}</option>`).join('')}</select>
 ${L.map(f=>`<div class=card style="${f.estado=='anulada'?'opacity:.55':''}" onclick="go('fd','${f.id}')"><div class=row><b>Nº ${f.num} · ${esc(f.nombre)}</b><b>${eur(f.total)} €</b></div><div class=mut>${fdate(f.fecha)}</div>${tags(f)}</div>`).join('')||'<p class=mut>Todavía no hay facturas en este trimestre.</p>'}
 ${ok.length?`<button class="btn s" onclick="askTrim()">📤 Enviar las ${ok.length} facturas al gestor</button>`:''}`};
V.rl=()=>`<button class=btn onclick="go('rf')">➕ Nuevo recibo</button>
 ${chk.size?`<button class="btn g" onclick="askPrintR()">🖨️ Imprimir los ${chk.size} marcados</button>`:'<p class=mut>Marca hasta 3 recibos para imprimirlos juntos en una hoja.</p>'}
 ${S.rec.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(r=>`<div class=card><label class=row style="margin:0"><span><input type=checkbox style="width:26px;height:26px;vertical-align:middle" ${chk.has(r.id)?'checked':''} onchange="tg('${r.id}')"> <b>${esc(r.nombre)}</b></span><b>${eur(r.total)} €</b></label><div class=mut style="margin:2px 0 4px">${fdate(r.fecha)}</div><span class="tag ${r.copia?'k':'w'}">${r.copia?'Copia en Drive':'Falta copia en Drive'}</span><div style="height:8px"></div>
 <div class=row><button class="btn s m" onclick="go('rf','e${r.id}')">Editar</button><button class="btn s m" onclick="go('rf','r${r.id}')">Repetir</button><button class="btn r m" onclick="delR('${r.id}')">Borrar</button></div></div>`).join('')}`;
function tg(id){if(chk.has(id))chk.delete(id);else if(chk.size>=3){alert('Caben 3 recibos en una hoja.');}else chk.add(id);render()}
function delR(id){if(!confirm('¿Borrar este recibo?'))return;S.rec=S.rec.filter(r=>r.id!=id);chk.delete(id);save();render()}
V.rf=a=>{const r=a&&S.rec.find(x=>x.id==a.slice(1))||{},rep=a&&a[0]=='r';
 return `<div class=card><label style="margin-top:0">Cliente</label><select onchange="const c=S.cli.find(x=>x.id==this.value);if(c)$('#n').value=c.nombre">${cliOpts()}</select>
 <label>Nombre</label><input id=n value="${esc(r.nombre)}">
 <label>Importe total (€)</label><input id=b inputmode=decimal value="${rep?'':(r.total??'')}">
 <label>Fecha</label><input id=fe type=date value="${rep?today():(r.fecha||today())}">
 <label>Concepto</label><input id=co value="${esc(r.concepto||S.concepto)}"></div>
 <button class=btn onclick="saveR('${a&&!rep?a.slice(1):''}')">Guardar recibo</button>`};
function saveR(id){const g=i=>$('#'+i).value.trim(),nombre=g('n'),total=r2(num(g('b')));
 if(!nombre||total<=0)return alert('Falta el nombre o el importe.');
 let r=id&&S.rec.find(x=>x.id==id);const d={nombre,total,fecha:g('fe'),concepto:g('co')};
 if(r){Object.assign(r,d);r.copia=false}else{r={id:uid(),...d,copia:false};S.rec.push(r);if(chk.size<3)chk.add(r.id)}save();go('rl');askCopyR(r.id)}
V.cl=()=>`<button class=btn onclick="go('cf','')">➕ Nuevo cliente</button>
 <input placeholder="Buscar cliente…" value="${esc(cq)}" oninput="cq=this.value;document.getElementById('lc').innerHTML=lc()" style="margin-bottom:12px"><div id=lc>${lc()}</div>`;
const lc=()=>S.cli.filter(c=>c.nombre.toLowerCase().includes(cq.toLowerCase())).sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>`<div class=card onclick="go('cf','${c.id}')"><b>${esc(c.nombre)}</b><div class=mut>${esc(c.calle)}</div></div>`).join('')||'<p class=mut>No hay clientes todavía. Se crean solos al hacer una factura.</p>';
V.cf=id=>{const c=id&&S.cli.find(x=>x.id==id)||{};
 return `<div class=card><label style="margin-top:0">Nombre</label><input id=n value="${esc(c.nombre)}"><label>Calle</label><input id=c value="${esc(c.calle)}"><label>NIF o CIF</label><input id=nf value="${esc(c.nif)}"><label>Precio habitual sin IVA (€)</label><input id=b inputmode=decimal value="${c.precio??''}"></div>
 <button class=btn onclick="saveC('${id||''}')">Guardar cliente</button>${id?`<button class="btn r" onclick="delC('${id}')">Borrar cliente</button><p class=mut>Borrar un cliente no toca sus facturas.</p>`:''}`};
function saveC(id){const g=i=>$('#'+i).value.trim();if(!g('n'))return alert('Falta el nombre.');
 if(id){const c=S.cli.find(x=>x.id==id);Object.assign(c,{nombre:g('n'),calle:g('c'),nif:g('nf'),precio:num(g('b'))||undefined})}else addCli({nombre:g('n'),calle:g('c'),nif:g('nf'),precio:num(g('b'))});save();go('cl')}
function delC(id){if(!confirm('¿Borrar este cliente?'))return;S.cli=S.cli.filter(c=>c.id!=id);save();go('cl')}
V.aj=()=>{const m=S.me;
 return `<div class=card><label style="margin-top:0">Tu nombre (como sale en la factura)</label><input id=mn value="${esc(m.nombre)}"><label>NIF</label><input id=mi value="${esc(m.nif)}"><label>Móvil</label><input id=mt inputmode=tel value="${esc(m.tel)}"><label>Dirección (calle, CP y población)</label><input id=md value="${esc(m.dir)}">
 <label>Próximo número de factura</label><input id=mx inputmode=numeric value="${S.next??''}"><label>Concepto de siempre</label><input id=mc value="${esc(S.concepto)}"></div>
 <button class=btn onclick="saveA()">Guardar</button>
 <div class=card><b>Copia de seguridad</b><p class=mut>Última: ${S.bk?fdate(S.bk):'nunca'}. Guárdala en Drive.</p><button class="btn s" style="margin:0" onclick="backup()">💾 Hacer copia de seguridad</button></div>
 <div class=card><b>Cargar datos de un archivo</b><p class=mut>Para restaurar una copia o importar los clientes de Drive.</p><input type=file accept=".json,text/plain" onchange="imp(this)"></div>`};
function saveA(){const g=i=>$('#'+i).value.trim();S.me={nombre:g('mn'),nif:g('mi'),tel:g('mt'),dir:g('md')};S.concepto=g('mc')||S.concepto;const x=parseInt(g('mx'));S.next=x||S.next;save();go('home')}
function imp(inp){const fl=inp.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);
 if(d.fac){if(!confirm('Esto sustituye TODO lo que hay ahora en la app. ¿Seguro?'))return;S=Object.assign({me:{},cli:[],fac:[],rec:[],next:null,concepto:S.concepto,bk:null},d)}
 else{(d.clientes||[]).forEach(addCli);if(d.ultimoNumero&&(S.next==null||S.next<=d.ultimoNumero))S.next=d.ultimoNumero+1}
 save();alert('Datos cargados.');go('home')}catch(e){alert('El archivo no es válido.')}};rd.readAsText(fl)}
render();
</script></body></html>
