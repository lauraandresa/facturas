<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a6e6e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Mis facturas</title>
<style>
:root{--bg:#f2f5f4;--tx:#0f1f1e;--mut:#5d6f6d;--ac:#0f766e;--ac2:#0b5a54;--acl:#d9efec;--ok:#15803d;--bad:#b91c1c;--ln:#d6e0de;--amb:#fcd34d;--sh:0 1px 2px #0b2a2812,0 6px 18px #0b2a280f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{background:var(--ac);color:#fff;padding:10px 10px 10px 6px;display:flex;align-items:center;gap:4px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0b2a2826}
header span{flex:1;font-size:21px;font-weight:700;letter-spacing:.2px;padding-left:4px}
header button{background:none;border:0;color:#fff;width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
header button:active{background:#ffffff26}
header svg{width:26px;height:26px}
header .rb{width:auto;padding:0 14px 0 10px;height:42px;background:var(--amb);color:#3b2a00;font:800 15px system-ui;letter-spacing:.8px;border-radius:21px;display:flex;gap:6px;align-items:center;margin-right:2px}
header .rb svg{width:20px;height:20px}
main{padding:18px 16px;max-width:560px;margin:auto}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.btn{display:block;width:100%;min-height:60px;border:0;border-radius:16px;background:var(--ac);color:#fff;font:700 19px system-ui;margin-bottom:12px;padding:12px;box-shadow:0 2px 0 var(--ac2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.s{background:#fff;color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac)}
.btn.g{background:var(--ok);box-shadow:0 2px 0 #0f5f2b}
.btn.r{background:#fff;color:var(--bad);box-shadow:inset 0 0 0 2px #e9b4b4}
.btn.m{min-height:48px;font-size:16px;margin:0;border-radius:14px}
.big{min-height:130px;font-size:26px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 4px 0 var(--ac2),0 10px 24px #0f766e40}
.plus{font-size:50px;line-height:1;font-weight:300}
label{display:block;font-weight:600;font-size:15px;color:var(--mut);margin:16px 0 6px}
input,select{width:100%;font:inherit;font-size:19px;padding:0 14px;height:54px;border:2px solid var(--ln);border-radius:14px;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px #0f766e26}
.alert{background:#fff7dd;border-left:6px solid #e0a100;border-radius:16px;padding:14px 16px;margin-bottom:14px;font-weight:600;box-shadow:var(--sh)}
.alert .btn{margin:12px 0 0}
.lbl{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:4px 2px 8px}
.tot{display:flex;justify-content:space-between;padding:3px 0}
.tot.t{font-weight:800;font-size:24px;border-top:2px solid var(--ln);margin-top:8px;padding-top:12px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mut{color:var(--mut);font-size:15px}
.num{font-size:22px;font-weight:800}.amt{font-size:21px;font-weight:800;white-space:nowrap}
.tag{font-size:13px;font-weight:700;border-radius:20px;padding:3px 11px;background:#e4eaea;display:inline-block;margin:6px 6px 0 0}
.tag.w{background:#ffe29a}.tag.k{background:#c3ecd0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;box-shadow:0 -2px 14px #0b2a2818}
nav button{flex:1;border:0;background:none;padding:10px 2px 12px;font:600 13px system-ui;color:var(--mut)}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
nav svg{width:26px;height:26px;display:block;margin:0 auto 2px}
.modal{position:fixed;inset:0;background:#0b1f1e99;display:flex;padding:20px;z-index:9}
.modal>div{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:520px;margin:auto;box-shadow:0 20px 50px #0006}
h2{margin:0 0 10px;font-size:24px}
.seg{display:flex;background:#e4eaea;border-radius:14px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:48px;font:700 17px system-ui;color:var(--mut)}.seg button.on{background:#fff;color:var(--ac);box-shadow:var(--sh)}
.warn{background:#fff7dd;border-left:6px solid #e0a100;border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:600;font-size:16px}
.pick{background:#eef7f6;border-radius:14px;padding:12px 14px;margin-top:8px}.pick:active{background:var(--acl)}
</style></head><body>
<header><button id="bk" onclick="back()"><svg class=i viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span id="t"></span>
<button class="rb" onclick="go('rf')"><svg class=i viewBox="0 0 24 24"><path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6"/></svg>RECIBO</button>
<button onclick="go('aj')" aria-label="Mis datos"><svg class=i viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></header>
<main id="app"></main><div id="m"></div>
<nav>
<button data-v="home" onclick="go('home')"><svg class=i viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
<button data-v="fl" onclick="go('fl')"><svg class=i viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8"/></svg>Facturas</button>
<button data-v="rl" onclick="go('rl')"><svg class=i viewBox="0 0 24 24"><path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6"/></svg>Recibos</button>
<button data-v="cl" onclick="go('cl')"><svg class=i viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Clientes</button>
</nav>
<script src="jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app'),K='facturas-v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{me:{},cli:[],fac:[],rec:[],next:null,concepto:'LIMPIEZA DE SU ESTABLECIMIENTO',bk:null};
S.rec=S.rec.map(r=>r.items?r:{id:r.id,copia:r.copia,items:[{nombre:r.nombre,total:r.total,fecha:r.fecha,concepto:r.concepto}]});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('No se pudo guardar en el móvil. Avisa a quien te ayuda.')}};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const uid=()=>Math.random().toString(36).slice(2,10),r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const eur=n=>Number(n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{let s=String(v).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0};
const cm=n=>n==null||n===''?'':String(n).replace('.',',');
const nz=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=i=>i.split('-').reverse().join('/');
const trimOf=i=>i.slice(0,4)+'-T'+(Math.floor((+i.slice(5,7)-1)/3)+1);
const trL=t=>t.split('-T')[1]+'T '+t.split('-')[0];
function trimOpts(sel){const y=new Date().getFullYear(),o=[];for(let a=y+1;a>=y-1;a--)for(let q=4;q>=1;q--)o.push(a+'-T'+q);if(!o.includes(sel))o.push(sel);return o.map(t=>`<option value="${t}" ${t==sel?'selected':''}>${trL(t)}</option>`).join('')}
const cliOpts=()=>'<option value="">— Elegir cliente —</option>'+S.cli.slice().sort((a,b)=>(a.file||a.nombre).localeCompare(b.file||b.nombre)).map(c=>`<option value="${c.id}">${esc(c.file||c.nombre)}</option>`).join('');
function addCli(c){const k=(c.nombre||'').trim();if(!k)return;let x=S.cli.find(y=>y.nombre.toLowerCase()==k.toLowerCase());if(!x){x={id:uid()};S.cli.push(x)}x.nombre=k;x.file=(c.file||'').trim()||x.file||'';x.calle=c.calle||x.calle||'';x.nif=c.nif||x.nif||'';if(c.precio)x.precio=num(c.precio);if(c.copias)x.copias=+c.copias}
const tags=f=>f.estado=='anulada'?'<span class=tag>Anulada</span>':`<span class="tag ${f.enviada?'k':''}">${f.enviada?'Enviada':'Sin enviar'}</span><span class="tag ${f.copia?'k':'w'}">${f.copia?'Copia en Drive':'Falta copia en Drive'}</span>${f.corr?'<span class=tag>Corregida</span>':''}`;

/* ---------- PDF ---------- */
const PDF=()=>new window.jspdf.jsPDF({unit:'mm',format:'a4'});
function drawF(d,f,y){
 const m=S.me,L=15,R=195;
 d.setFont('helvetica','normal');d.setFontSize(10);d.text(fdate(f.fecha),R,y+10,{align:'right'});
 d.setFont('helvetica','bold');d.setFontSize(11);d.text((m.nombre||'').toUpperCase(),L,y+18);
 d.setFont('helvetica','normal');d.setFontSize(10);
 d.text('N.I.F.: '+(m.nif||''),L,y+25);d.text('MOVIL: '+(m.tel||''),L,y+31);d.text(m.dir||'',L,y+37);
 const t=y+43,ys=[t+10,t+38,t+47,t+56,t+65];
 d.setLineWidth(.3);d.rect(L,t,R-L,74);ys.forEach(v=>d.line(L,v,R,v));d.line(105,t,105,t+38);d.line(105,t+38,105,t+74);
 d.setFont('helvetica','bold');d.text('FACTURA Nº: '+f.num,L+2,t+6.5);d.text('DESTINATARIO:',107,t+6.5);
 d.text('CONCEPTO:',L+2,t+44);d.text('IMPORTE:',107,t+44);
 d.setFont('helvetica','normal');d.text('Fdo.:',L+2,t+16);if(m.firma)d.addImage(m.firma,'PNG',L+12,t+13,50,20);
 d.text(d.splitTextToSize([f.nombre,f.calle,f.nif].filter(Boolean).join('\n'),86),107,t+16);
 d.text(d.splitTextToSize(f.concepto||'',88),L+2,t+53);d.text(eur(f.base)+' €',R-2,t+53,{align:'right'});
 d.text('+21% IVA',L+2,t+62);d.text(eur(f.iva)+' €',R-2,t+62,{align:'right'});
 d.setFont('helvetica','bold');d.text('TOTAL',L+2,t+71);d.text(eur(f.total)+' €',R-2,t+71,{align:'right'});
}
function facPDF(f,n){const d=PDF();for(let i=0;i<n;i++)drawF(d,f,8+i*148);return d.output('blob')}
function recPDF(L){const d=PDF();L.forEach((r,i)=>{const y=i*99+14;
 d.setFontSize(12);d.setFont('helvetica','bold');d.text('RECIBO',15,y);d.setFont('helvetica','normal');
 d.text('CONCEPTO: '+(r.concepto||''),15,y+10);d.text('DESTINATARIO: '+r.nombre,15,y+20);d.text('FECHA: '+fdate(r.fecha),15,y+30);
 d.setFont('helvetica','bold');d.text('TOTAL: '+eur(r.total)+' €',195,y+42,{align:'right'});d.setFont('helvetica','normal');d.text('Fdo.:',15,y+54);
 if(i<2){d.setLineDash([2,2]);d.line(10,y+78,200,y+78);d.setLineDash([])}});return d.output('blob')}
const fname=f=>`${(f.file||f.nombre).replace(/[\\/:*?"<>|]+/g,'-')} N${f.num}.pdf`;
const copiasOf=f=>{const c=S.cli.find(x=>x.nombre==f.nombre);return c&&c.copias==1?1:2};
const mk=(b,n,t)=>new File([b],n,{type:t||'application/pdf'});

/* ---------- compartir ---------- */
async function shareFiles(files){
 if(navigator.canShare&&navigator.canShare({files})){
  try{await navigator.share({files});return true}catch(e){if(e.name==='AbortError')return false}
 }
 files.forEach(f=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()});
 alert('El móvil no abrió el menú de compartir. El archivo se ha descargado.');return 'dl';
}
async function sendF(id){const f=S.fac.find(x=>x.id==id);if(await shareFiles([mk(facPDF(f,1),fname(f))])===true){f.enviada=true;save();render()}}
async function printF(id){const f=S.fac.find(x=>x.id==id);shareFiles([mk(facPDF(f,f.tablas||copiasOf(f)),'IMPRIMIR_'+fname(f))])}
async function copyF(id){const f=S.fac.find(x=>x.id==id);if(await shareFiles([mk(facPDF(f,1),fname(f))])===true){f.copia=true;save();render()}}
async function sendTrim(){const L=S.fac.filter(f=>f.trim==ftr&&f.estado!='anulada').sort((a,b)=>a.num-b.num);shareFiles(L.map(f=>mk(facPDF(f,1),fname(f))))}
async function printR(id){const r=S.rec.find(x=>x.id==id);shareFiles([mk(recPDF(r.items),'IMPRIMIR_recibos.pdf')])}
async function backup(){if(await shareFiles([mk(JSON.stringify(S),'copia-facturas-'+today()+'.json','text/plain')])){S.bk=today();save();render()}}
const showM=h=>$('#m').innerHTML=`<div class=modal><div>${h}</div></div>`,closeM=()=>$('#m').innerHTML='';
const askCopy=id=>{const f=S.fac.find(x=>x.id==id);showM(`<h2>Guarda la copia</h2><p>Guárdala en la carpeta <b>${trL(f.trim)}</b> de Drive para que no se pierda.</p><button class="btn g" onclick="copyF('${id}');closeM()">💾 Guardar copia ahora</button><button class="btn s" style="margin:0" onclick="closeM()">Más tarde</button>`)};

const askPrintOffer=id=>showM(`<h2>Recibos guardados</h2><p>¿Los imprimes ahora?</p><button class="btn" onclick="askPrintR('${id}')">🖨️ Imprimir</button><button class="btn s" style="margin:0" onclick="closeM()">Ahora no</button>`);
const steps=(t,l,fn)=>showM(`<h2>${t}</h2><ol style="padding-left:24px;font-size:20px;line-height:1.6">${l.map(s=>`<li>${s}</li>`).join('')}</ol><button class="btn" onclick="closeM();${fn}">Continuar</button><button class="btn s" style="margin:0" onclick="closeM()">Cancelar</button>`);
const askPrint=id=>steps('Para imprimir',['Se abre una lista de aplicaciones.','Busca y selecciona <b>HP Print</b>.'],"printF('"+id+"')");
const askPrintR=id=>steps('Para imprimir',['Se abre una lista de aplicaciones.','Busca y selecciona <b>HP Print</b>.'],"printR('"+id+"')");
const askSend=id=>steps('Para enviar',['Se abre una lista de aplicaciones.','Selecciona <b>Yahoo</b> y escribe la dirección de correo,<br>o selecciona <b>WhatsApp</b> y el contacto.'],"sendF('"+id+"')");
const askTrim=()=>steps('Para enviar al gestor',['Se abre una lista de aplicaciones.','Selecciona <b>Yahoo</b> y escribe la dirección de correo de la gestora.'],'sendTrim()');
/* ---------- pantallas ---------- */
let sigDirty=false;
function initSig(){const c=$('#sg'),x=c.getContext('2d');x.lineWidth=6;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#000';
 if(S.me.firma){const i=new Image();i.onload=()=>x.drawImage(i,0,0,c.width,c.height);i.src=S.me.firma}
 let d=false;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{d=true;sigDirty=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b);x.stroke()};
 c.onpointermove=e=>{if(!d)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
 c.onpointerup=c.onpointercancel=()=>{d=false}}
function clrSig(){const c=$('#sg');c.getContext('2d').clearRect(0,0,c.width,c.height);sigDirty=true}
let view='home',arg=null,ftr=null,cq='',fq='';
const V={},BACK={ff:'fl',fd:'fl',rf:'rl',cf:'cl',pend:'home',aj:'home'},NAV={pend:'home',aj:'home',ff:'fl',fd:'fl',rf:'rl',cf:'cl'};
const go=(v,a)=>{view=v;arg=a;render();scrollTo(0,0)},back=()=>go(BACK[view]||'home');
function render(){
 $('#t').textContent={home:'Mis facturas',pend:'Falta guardar copia',ff:'Factura',fd:'Factura',fl:'Facturas',rl:'Recibos',rf:'Crear recibos',cl:'Clientes',cf:'Cliente',aj:'Mis datos'}[view];
 $('#bk').style.display=BACK[view]?'grid':'none';
 app.innerHTML=V[view](arg);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(NAV[view]||view)));
 if(view=='ff'){upd();setTb(+$('#sgt').dataset.t)}if(view=='aj')initSig();
}
V.home=()=>{
 const p=S.fac.filter(f=>f.estado!='anulada'&&!f.copia),old=(S.fac.length+S.rec.length)&&(!S.bk||(Date.now()-new Date(S.bk))/864e5>7),last=S.fac.slice().sort((a,b)=>b.num-a.num)[0];
 return `<button class="btn big" onclick="go('ff')"><span class=plus>+</span>Nueva factura</button>
 ${!S.me.nombre?`<div class=alert>Antes de empezar, escribe tus datos.<button class=btn onclick="go('aj')">Escribir mis datos</button></div>`:''}
 ${p.length?`<div class=alert>⚠️ ${p.length==1?'Falta 1 factura':'Faltan '+p.length+' facturas'} por guardar en la carpeta de Drive.<button class=btn onclick="go('pend')">Guardar ahora</button></div>`:''}
 ${old?`<div class=alert>Haz la copia de seguridad: tus recibos solo están guardados en la app.<button class=btn onclick="backup()">Hacer copia ahora</button></div>`:''}
 ${last?`<div class=lbl>Última factura</div><div class=card onclick="go('fd','${last.id}')"><div class=row><div><div class=num>${esc(last.file||last.nombre)} N${last.num}</div></div><div class=amt>${eur(last.total)} €</div></div><div class=mut style="margin-top:4px">${fdate(last.fecha)}</div></div>`:''}`};
V.pend=()=>{const p=S.fac.filter(f=>f.estado!='anulada'&&!f.copia).sort((a,b)=>a.num-b.num);
 return p.map(f=>`<div class=card><b>${esc(f.file||f.nombre)} N${f.num}</b><div class=mut>Carpeta ${trL(f.trim)}</div><button class="btn g" style="margin:10px 0 0" onclick="copyF('${f.id}')">💾 Guardar copia</button></div>`).join('')||'<p>Todo guardado. 👍</p>'};
V.ff=id=>{
 const f=id&&S.fac.find(x=>x.id==id)||{},fe=f.fecha||today(),first=S.next==null&&!f.num;
 return `${id&&(f.enviada||f.copia)?'<div class=alert>Esta factura ya la enviaste o la guardaste. Si la cambias, tendrás que enviarla y guardarla otra vez.</div>':''}
 <div class=card><label style="margin-top:0">Buscar cliente</label><input id=cs type=search placeholder="🔍 Escribe el nombre…" autocomplete=off oninput="cSearch()" onfocus="cSearch()"><div id=cr></div>
 <label>Nombre corto (para el archivo y para buscarla)</label><input id=fl value="${esc(f.file)}">
 <label>Nombre completo (el que sale en la factura)</label><input id=n value="${esc(f.nombre)}">
 <label>Calle</label><input id=c value="${esc(f.calle)}">
 <label>NIF o CIF (si lo tiene)</label><input id=nf value="${esc(f.nif)}">
 <label>Importe SIN IVA (€)</label><input id=b inputmode=decimal value="${cm(f.base)}" oninput="upd()">
 <div style="margin-top:12px"><div class=tot><span>IVA 21%</span><b id=iv></b></div><div class="tot t"><span>TOTAL</span><span id=to></span></div></div></div>
 <div class=card><label style="margin-top:0">Fecha</label><input id=fe type=date value="${fe}" onchange="$('#tr').value=trimOf(this.value)">
 <label>Carpeta del trimestre</label><select id=tr>${trimOpts(f.trim||trimOf(fe))}</select>
 <label>Nº de factura${first?' (el de tu última factura + 1)':''}</label><input id=nu inputmode=numeric value="${f.num||S.next||''}">
 <label>Concepto</label><input id=co value="${esc(f.concepto||S.concepto)}">
 <label>Al imprimir, tablas en la hoja</label><div class=seg id=sgt data-t="${f.tablas||2}"><button type=button data-t=1 onclick="setTb(1)">1 tabla</button><button type=button data-t=2 onclick="setTb(2)">2 tablas</button></div><div id=tbw></div></div>
 <button class=btn onclick="saveF('${id||''}')">Guardar factura</button>`};
function setTb(n){const s=$('#sgt');s.dataset.t=n;s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.t==n));$('#tbw').innerHTML=n==1?'<div class=warn>⚠️ Cuidado: se imprimirá una sola tabla en la hoja.</div>':''}
function cSearch(){
 const q=nz($('#cs').value).split(/\s+/).filter(Boolean),al=(a,b)=>(a.file||a.nombre).localeCompare(b.file||b.nombre);
 let L=S.cli.filter(c=>{const s=nz(c.file+' '+c.nombre);return q.every(w=>s.includes(w))}).sort(al);
 if(!q.length){const rc=[];S.fac.slice().sort((a,b)=>b.num-a.num).forEach(f=>{const c=S.cli.find(x=>x.nombre==f.nombre);if(c&&!rc.includes(c))rc.push(c)});L=rc.length?rc:L}
 $('#cr').innerHTML=(q.length||!L.length?'':'<div class=lbl style="margin-top:10px">'+(S.fac.length?'Últimos clientes':'Clientes')+'</div>')
  +L.slice(0,6).map(c=>`<div class=pick onclick="pickC('${c.id}')"><b>${esc(c.file||c.nombre)}</b><div class=mut>${esc(c.calle)}</div></div>`).join('')
  +(L.length>6?`<p class=mut style="margin:8px 0 0">Hay ${L.length-6} más. Sigue escribiendo para encontrarlo.</p>`:'')
  +(q.length&&!L.length?'<p class=mut style="margin:8px 0 0">No hay ningún cliente así. Rellena los datos de abajo y se creará.</p>':'')}
function pickC(id){fillC(id);const c=S.cli.find(x=>x.id==id);$('#cs').value=c.file||c.nombre;$('#cr').innerHTML='';$('#cs').blur()}
const fillC=id=>{const c=S.cli.find(x=>x.id==id);if(!c)return;$('#fl').value=c.file||'';$('#n').value=c.nombre;$('#c').value=c.calle;$('#nf').value=c.nif||'';$('#b').value=cm(c.precio);upd();setTb(c.copias==1?1:2)};
function upd(){const b=r2(num($('#b').value)),i=r2(b*.21);$('#iv').textContent=b?eur(i)+' €':'—';$('#to').textContent=b?eur(b+i)+' €':'—'}
function saveF(id){
 const g=i=>$('#'+i).value.trim(),nombre=g('n'),calle=g('c'),base=r2(num(g('b'))),n=parseInt(g('nu'));
 if(!nombre||!calle||base<=0)return alert('Falta el nombre, la calle o el importe.');
 if(!n)return alert('Falta el número de factura.');
 if(S.fac.some(f=>f.num==n&&f.id!=id))return alert('Ya existe la factura nº '+n+'.');
 const iva=r2(base*.21),d={num:n,fecha:g('fe'),trim:g('tr'),nombre,file:g('fl')||nombre,calle,nif:g('nf'),base,iva,total:r2(base+iva),concepto:g('co'),tablas:+$('#sgt').dataset.t};
 let f=id&&S.fac.find(x=>x.id==id);
 if(f){if(f.enviada||f.copia){f.hist=(f.hist||[]).concat([{num:f.num,fecha:f.fecha,nombre:f.nombre,calle:f.calle,nif:f.nif,base:f.base,total:f.total,en:today()}]);f.corr=true;f.enviada=false;f.copia=false}Object.assign(f,d)}
 else{f={id:uid(),estado:'activa',enviada:false,copia:false,...d};S.fac.push(f)}
 S.next=Math.max(S.next||0,n+1);addCli({nombre,file:d.file,calle,nif:d.nif,precio:base});{const cc=S.cli.find(x=>x.nombre.toLowerCase()==nombre.toLowerCase());if(cc){if(d.tablas==1)cc.copias=1;else delete cc.copias}}save();go('fd',f.id);askCopy(f.id);
}
V.fd=id=>{const f=S.fac.find(x=>x.id==id);if(!f)return'';
 return `<div class=card><div class=row><b>Factura nº ${f.num}</b><span class=mut>${fdate(f.fecha)}</span></div>
 <div style="font-size:21px;margin:6px 0">${esc(f.nombre)}</div><div class=mut>${esc(f.calle)}</div><div class=mut>Archivo: ${esc(fname(f))}</div>
 <div class="tot t"><span>Total</span><span>${eur(f.total)} €</span></div><div class=mut>Sin IVA ${eur(f.base)} € · IVA ${eur(f.iva)} € · Carpeta ${trL(f.trim)}</div>
 <div style="margin-top:10px">${tags(f)}</div></div>
 ${f.estado=='anulada'?'':`<button class=btn onclick="askSend('${id}')">📤 Enviar (WhatsApp o Yahoo)</button>
 <button class="btn s" onclick="askPrint('${id}')">🖨️ Imprimir (${(f.tablas||copiasOf(f))==1?'1 tabla':'2 tablas'})</button>
 <button class="btn ${f.copia?'s':'g'}" onclick="copyF('${id}')">💾 ${f.copia?'Guardar otra copia':'Guardar copia en Drive ('+trL(f.trim)+')'}</button>
 <button class="btn s" onclick="go('ff','${id}')">✏️ Corregir</button>
 <button class="btn r" onclick="anular('${id}')">Anular factura</button>`}`};
function anular(id){if(!confirm('¿Anular esta factura? Se queda en la lista como anulada y su número no se vuelve a usar.'))return;S.fac.find(x=>x.id==id).estado='anulada';save();render()}
const fcard=(f,t)=>`<div class=card style="${f.estado=='anulada'?'opacity:.55':''}" onclick="go('fd','${f.id}')"><div class=row><div><div class=num>${esc(f.file||f.nombre)} N${f.num}</div>${f.file&&f.file!=f.nombre?`<div class=mut>${esc(f.nombre)}</div>`:''}</div><div class=amt>${eur(f.total)} €</div></div><div class=mut style="margin-top:2px">${fdate(f.fecha)}${t?' · '+trL(f.trim):''}</div>${tags(f)}</div>`;
V.fl=()=>{ftr=ftr||trimOf(today());return `<button class=btn onclick="go('ff')">➕ Nueva factura</button><input type=search placeholder="🔍 Buscar por cliente, número o fecha…" value="${esc(fq)}" oninput="fq=this.value;$('#lf').innerHTML=lf()" style="margin-bottom:14px"><div id=lf>${lf()}</div>`};
function lf(){
 const q=nz(fq).split(/\s+/).filter(Boolean);
 if(q.length){const R=S.fac.filter(f=>{const s=nz([f.file,f.nombre,f.calle,f.num,'n'+f.num,fdate(f.fecha),f.total].join(' '));return q.every(w=>s.includes(w))}).sort((a,b)=>b.num-a.num);
  return `<div class=lbl>${R.length} resultado${R.length==1?'':'s'}</div>`+(R.map(f=>fcard(f,1)).join('')||'<p class=mut>No hay ninguna factura con eso.</p>')}
 const ts=[...new Set(S.fac.map(f=>f.trim).concat(ftr))].sort().reverse(),L=S.fac.filter(f=>f.trim==ftr).sort((a,b)=>b.num-a.num),ok=L.filter(f=>f.estado!='anulada');
 return `<select style="margin-bottom:12px" onchange="ftr=this.value;render()">${ts.map(t=>`<option value="${t}" ${t==ftr?'selected':''}>Trimestre ${trL(t)}</option>`).join('')}</select>
 ${L.map(f=>fcard(f)).join('')||'<p class=mut>Todavía no hay facturas en este trimestre.</p>'}
 ${ok.length?`<button class="btn s" onclick="askTrim()">📤 Enviar ${ok.length==1?'la factura':'las '+ok.length+' facturas'} al gestor</button>`:''}`}
V.rl=()=>`<button class=btn onclick="go('rf')">📝 Crear recibos</button>
 ${S.rec.slice().reverse().map(r=>`<div class=card><div class=lbl>${r.items.length==1?'1 recibo':r.items.length+' recibos'}</div>${r.items.map(i=>`<div class=row style="margin-bottom:6px"><span><b>${esc(i.nombre)}</b> <span class=mut>${fdate(i.fecha)}</span></span><b>${eur(i.total)} €</b></div>`).join('')}
 <div class=row style="margin-top:10px"><button class="btn m" onclick="askPrintR('${r.id}')">🖨️ Imprimir</button><button class="btn s m" onclick="go('rf','${r.id}')">Editar</button></div>
 <div class=row style="margin-top:8px"><button class="btn r m" onclick="delR('${r.id}')">Borrar</button></div></div>`).join('')||'<p class=mut>Todavía no hay recibos.</p>'}`;
function delR(id){if(!confirm('¿Borrar estos recibos?'))return;S.rec=S.rec.filter(r=>r.id!=id);save();render()}
V.rf=id=>{const cur=id&&S.rec.find(x=>x.id==id),last=S.rec[S.rec.length-1],mine=i=>(cur&&cur.items[i])||{};
 const rows=[0,1,2].map(i=>{const m=mine(i);return `<div class=card><b>Recibo ${i+1}</b>
 <label>Nombre</label><input id=n${i} list=cn value="${esc(m.nombre)}">
 <label>Fecha</label><input id=f${i} type=date value="${m.fecha||today()}">
 <label>Importe (€)</label><input id=b${i} inputmode=decimal value="${cm(m.total)}"></div>`}).join('');
 return `${!cur&&last?`<button class="btn s" onclick="useLast()">↺ Usar los nombres de la última vez</button>`:''}
 <datalist id=cn>${S.cli.map(c=>`<option value="${esc(c.file||c.nombre)}">`).join('')}</datalist>${rows}
 <div class=card><label style="margin-top:0">Concepto (igual en todos)</label><input id=co value="${esc((cur&&cur.items[0]&&cur.items[0].concepto)||S.concepto)}"></div>
 <p class=mut>Rellena solo los recibos que necesites. Los que dejes vacíos no se imprimen.</p>
 <button class=btn onclick="saveR('${id||''}')">Guardar recibos</button>`};
function useLast(){const l=S.rec[S.rec.length-1];l.items.forEach((it,i)=>{$('#n'+i).value=it.nombre});$('#co').value=l.items[0].concepto||S.concepto}
function saveR(id){const g=i=>$('#'+i).value.trim(),items=[];
 for(let i=0;i<3;i++){const nombre=g('n'+i),total=r2(num(g('b'+i)));if(!nombre&&!total)continue;
  if(!nombre||total<=0)return alert('Recibo '+(i+1)+': falta el nombre o el importe. Si no lo quieres, deja las dos casillas vacías.');
  items.push({nombre,total,fecha:g('f'+i),concepto:g('co')})}
 if(!items.length)return alert('Escribe al menos un recibo.');
 let r=id&&S.rec.find(x=>x.id==id);
 if(r)r.items=items;else{r={id:uid(),items};S.rec.push(r)}
 save();go('rl');askPrintOffer(r.id)}
V.cl=()=>`<button class=btn onclick="go('cf','')">➕ Nuevo cliente</button>
 <input placeholder="Buscar cliente…" value="${esc(cq)}" oninput="cq=this.value;document.getElementById('lc').innerHTML=lc()" style="margin-bottom:12px"><div id=lc>${lc()}</div>`;
const lc=()=>S.cli.filter(c=>nz(c.file+' '+c.nombre).includes(nz(cq))).sort((a,b)=>(a.file||a.nombre).localeCompare(b.file||b.nombre)).map(c=>`<div class=card onclick="go('cf','${c.id}')"><b>${esc(c.file||c.nombre)}</b><div class=mut>${c.file&&c.file!=c.nombre?esc(c.nombre)+' · ':''}${esc(c.calle)}</div></div>`).join('')||'<p class=mut>No hay clientes todavía. Se crean solos al hacer una factura.</p>';
V.cf=id=>{const c=id&&S.cli.find(x=>x.id==id)||{};
 return `<div class=card><label style="margin-top:0">Nombre corto (para el archivo y para buscar)</label><input id=fl value="${esc(c.file)}"><label>Nombre completo (el que sale en la factura)</label><input id=n value="${esc(c.nombre)}"><label>Calle</label><input id=c value="${esc(c.calle)}"><label>NIF o CIF</label><input id=nf value="${esc(c.nif)}"><label>Precio habitual sin IVA (€)</label><input id=b inputmode=decimal value="${cm(c.precio)}"></div>
 <button class=btn onclick="saveC('${id||''}')">Guardar cliente</button>${id?`<button class="btn r" onclick="delC('${id}')">Borrar cliente</button><p class=mut>Borrar un cliente no toca sus facturas.</p>`:''}`};
function saveC(id){const g=i=>$('#'+i).value.trim();if(!g('n'))return alert('Falta el nombre.');
 if(id){const c=S.cli.find(x=>x.id==id);Object.assign(c,{nombre:g('n'),file:g('fl')||g('n'),calle:g('c'),nif:g('nf'),precio:num(g('b'))||undefined})}else addCli({nombre:g('n'),file:g('fl'),calle:g('c'),nif:g('nf'),precio:num(g('b'))});save();go('cl')}
function delC(id){if(!confirm('¿Borrar este cliente?'))return;S.cli=S.cli.filter(c=>c.id!=id);save();go('cl')}
V.aj=()=>{const m=S.me;
 return `<div class=card><label style="margin-top:0">Tu nombre (como sale en la factura)</label><input id=mn value="${esc(m.nombre)}"><label>NIF</label><input id=mi value="${esc(m.nif)}"><label>Móvil</label><input id=mt inputmode=tel value="${esc(m.tel)}"><label>Dirección (calle, CP y población)</label><input id=md value="${esc(m.dir)}">
 <label>Próximo número de factura</label><input id=mx inputmode=numeric value="${S.next??''}"><label>Concepto de siempre</label><input id=mc value="${esc(S.concepto)}"></div>
 <div class=card><b>Mi firma</b><p class=mut>Dibuja tu firma con el dedo. Saldrá en las facturas, donde pone «Fdo.». Los recibos salen sin firma.</p><canvas id=sg width=600 height=240 style="width:100%;height:auto;border:2px solid var(--ln);border-radius:12px;background:#fff;touch-action:none"></canvas><button class="btn r m" style="margin-top:10px" onclick="clrSig()">Borrar firma</button></div>
 <button class=btn onclick="saveA()">Guardar</button>
 <div class=card><b>Copia de seguridad</b><p class=mut>Última: ${S.bk?fdate(S.bk):'nunca'}. Guárdala en Drive.</p><button class="btn s" style="margin:0" onclick="backup()">💾 Hacer copia de seguridad</button></div>
 <div class=card><b>Cargar datos de un archivo</b><p class=mut>Para restaurar una copia o importar los clientes de Drive.</p><input type=file accept=".json,text/plain" onchange="imp(this)"></div>`};
function saveA(){const g=i=>$('#'+i).value.trim();let fm=S.me.firma||'';
 if(sigDirty){const c=$('#sg'),blank=!c.getContext('2d').getImageData(0,0,c.width,c.height).data.some((v,i)=>i%4==3&&v>0);fm=blank?'':c.toDataURL('image/png')}sigDirty=false;
 S.me={nombre:g('mn'),nif:g('mi'),tel:g('mt'),dir:g('md'),firma:fm};S.concepto=g('mc')||S.concepto;const x=parseInt(g('mx'));S.next=x||S.next;save();go('home')}
function imp(inp){const fl=inp.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result.replace(/("precio"\s*:\s*)(\d+),(\d+)/g,'$1$2.$3'));
 if(d.fac){if(!confirm('Esto sustituye TODO lo que hay ahora en la app. ¿Seguro?'))return;S=Object.assign({me:{},cli:[],fac:[],rec:[],next:null,concepto:S.concepto,bk:null},d)}
 else{(d.clientes||[]).forEach(addCli);if(d.ultimoNumero&&(S.next==null||S.next<=d.ultimoNumero))S.next=d.ultimoNumero+1}
 save();alert('Datos cargados.');go('home')}catch(e){alert('El archivo no es válido.')}};rd.readAsText(fl)}
render();
</script></body></html>
